[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reaxkit"
version = "3.1.0"
description = "A toolkit for parsing, analyzing, and visualizing ReaxFF simulation data."
authors = [
    { name = "Ali Mohammadi Dinani" },
    { email = "alimohammadi2265@gmail.com" },
    { name = "Adri van Duin", email = "acv13@psu.edu" },
    { name = "Yun Kyung Shin", email = "yks2@psu.edu" },
    { name = "Alireza Sepehrinezhad", email = "alireza.sepehri@psu.edu" },
    { name = "Seyed Mahmoud Mortazavi", email = "mahmoud.mortazavi72@gmail.com" },
    { name = "Anirban Phukan", email = "akp6421@psu.edu" },
    { name = "Jupjeet Dhingra", email = "jvd6198@psu.edu" },
    { name = "Swarit Dwivedi", email = "Swarit.Dwivedi@monash.edu" },
    { name = "Asma Ul Hosna", email = "abh6073@psu.edu" },
    { name = "Mozhdeh Mirakhory", email = "mjm8816@psu.edu" },
]
readme = "README.md"
license = { text = "MIT" }

requires-python = ">=3.9"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "tqdm",
    "rich",
    "tabulate",
    "PyYAML",
    "rapidfuzz",
    "openpyxl>=3.1",
    "pyarrow",
    "threadpoolctl>=3.1",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://ali-m-dinani.github.io/reaxkit/"
Documentation = "https://ali-m-dinani.github.io/reaxkit/"
Repository = "https://github.com/ali-m-dinani/reaxkit"
Issues = "https://github.com/ali-m-dinani/reaxkit/issues"

[project.optional-dependencies]
plot = [
    "matplotlib",
    "seaborn",
    "plotly",
    "imageio[ffmpeg]",
]
webui = [
    "dash",
    "dash_bootstrap_templates",
    "fastapi",
]
trajectory = [
    "MDAnalysis",
    "freud-analysis",
    "ovito",
]
materials = [
    "ase",
    "mp_api",
    "pymatgen",
]
graph = [
    "networkx",
    "igraph",
]
ml = [
    "dscribe",
    "spacy",
    "scikit-learn",
]
io = [
    "h5py",
    "python-docx",
    "zstandard",
]
engines = [
    "lammps",
    "plams",
]
all = [
    "reaxkit[plot,webui,trajectory,materials,graph,ml,io,engines]",
]

[project.scripts]
reaxkit = "reaxkit.cli_startup:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reaxkit = ["**/*.yaml", "**/*.xlsx", "**/*.cif"]

[tool.pytest.ini_options]
testpaths = ["tests"]

