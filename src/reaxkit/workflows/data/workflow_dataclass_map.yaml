    command: get_active_site_structural
    command_kind: analysis
    analysis_task: get_active_site_structural
    description: Computes structural descriptors for active sites across frames using trajectory-aligned
      connectivity data. It summarizes local neighbor counts, bonding patterns, and structural states around
      selected reactive sites.
    tags:
    - active site
    - connectivity trajectory
    - get active site structural
