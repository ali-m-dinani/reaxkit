  # BEGIN GENERATED COMMAND WORKFLOWS
  get_active_site_events:
    parent_workflow: active_site_workflow
    implementation_module: 'reaxkit.workflows.active_site_workflow: get_active_site_events'
    command: get_active_site_events
    command_kind: analysis
    analysis_task: get_active_site_events
    description: Detects time-resolved active-site events from connectivity trajectories by comparing bonded
      environments across frames. Use it to identify when selected sites form, break, or reorganize bonds
      during reactive simulations.
    tags:
    - active site
    - connectivity trajectory
    - get active site events
    - active site workflow
    - analysis workflow command
    notes:
